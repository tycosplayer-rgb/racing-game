<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#07071a" />
  <title>霓虹狂飙 · Racing Game</title>
  <link rel="stylesheet" href="css/style.css?v=3" />
</head>
<body>
  <div id="app">
    <header class="hud" aria-live="polite">
      <div class="hud-item">距离 <span id="distance">0</span>m</div>
      <div class="hud-item">速度 <span id="speed">0</span></div>
      <div class="hud-item">最高 <span id="best">0</span>m</div>
      <button type="button" id="btn-mute" class="mute-btn" aria-pressed="false" aria-label="静音切换">静音</button>
    </header>

    <div id="canvas-wrap">
      <canvas id="game" width="360" height="640"></canvas>
      <div id="drag-layer" class="inactive" aria-hidden="true"></div>
      <div id="overlay" class="overlay">
        <div class="overlay-box">
          <h1 id="overlay-title">霓虹狂飙</h1>
          <p id="overlay-sub">躲避对手与障碍，冲得越远越好</p>
          <div id="overlay-body"></div>
          <button id="overlay-btn" type="button">开始游戏</button>
        </div>
      </div>
    </div>

    <div id="touch-controls" class="touch-controls" aria-label="触屏操作">
      <button type="button" class="tbtn t-left" id="btn-left" aria-label="左转">◀</button>
      <button type="button" class="tbtn t-accel" id="btn-accel" aria-label="加速">▲ 加速</button>
      <button type="button" class="tbtn t-right" id="btn-right" aria-label="右转">▶</button>
    </div>

    <footer class="help">
      <p><strong>操作：</strong>在赛道上左右拖动手指，车子会跟着左右移动；也可点 ◀▶。中间加速；键盘 ←→ / A D。右上角可静音。</p>
    </footer>
  </div>

  <script src="js/audio.js?v=3"></script>
  <script src="js/game.js?v=3"></script>
</body>
</html>
